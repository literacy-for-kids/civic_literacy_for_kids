<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cbTitle">
  <title id="cbTitle">Checks and balances: each branch of government can limit the other two — Congress, the President, and the Courts</title>
  <defs>
    <marker id="cbA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="558" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Checks and Balances</text>
  <text x="430" y="64" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Every branch can limit the other two.</text>

  <!-- nodes -->
  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <rect x="330" y="86" width="200" height="62" rx="12" fill="#4338ca"/>
    <text x="430" y="112" font-size="15" font-weight="700" fill="#ffffff">LEGISLATIVE</text>
    <text x="430" y="132" font-size="13" fill="#c7d2fe">Congress &#183; makes laws</text>

    <rect x="60" y="440" width="210" height="62" rx="12" fill="#4338ca"/>
    <text x="165" y="466" font-size="15" font-weight="700" fill="#ffffff">EXECUTIVE</text>
    <text x="165" y="486" font-size="13" fill="#c7d2fe">President &#183; carries out laws</text>

    <rect x="590" y="440" width="210" height="62" rx="12" fill="#4338ca"/>
    <text x="695" y="466" font-size="15" font-weight="700" fill="#ffffff">JUDICIAL</text>
    <text x="695" y="486" font-size="13" fill="#c7d2fe">Courts &#183; interpret laws</text>
  </g>

  <!-- Congress <-> President (left side) -->
  <path d="M340,155 C260,220 200,320 170,432" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#cbA)"/>
  <path d="M205,435 C245,330 300,230 375,152" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#cbA)"/>
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="150" y="255" fill="#4338ca" font-weight="600">Congress checks the President:</text>
    <text x="150" y="273" fill="#475569">approves the budget &#183; can override</text>
    <text x="150" y="291" fill="#475569">a veto (&#8532;) &#183; can impeach</text>
    <text x="285" y="330" fill="#64748b" font-weight="600">President checks Congress:</text>
    <text x="285" y="348" fill="#64748b">can veto bills</text>
  </g>

  <!-- Congress <-> Courts (right side) -->
  <path d="M520,155 C600,220 660,320 690,432" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#cbA)"/>
  <path d="M655,435 C615,330 560,230 485,152" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#cbA)"/>
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="710" y="255" fill="#4338ca" font-weight="600" text-anchor="end">Congress checks the Courts:</text>
    <text x="710" y="273" fill="#475569" text-anchor="end">the Senate confirms judges</text>
    <text x="575" y="330" fill="#64748b" font-weight="600" text-anchor="end">Courts check Congress:</text>
    <text x="575" y="348" fill="#64748b" text-anchor="end">can strike down laws that</text>
    <text x="575" y="366" fill="#64748b" text-anchor="end">break the Constitution</text>
  </g>

  <!-- President <-> Courts (bottom) -->
  <path d="M272,458 C380,430 480,430 586,458" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#cbA)"/>
  <path d="M586,492 C480,522 380,522 272,492" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#cbA)"/>
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <text x="430" y="418" fill="#4338ca" font-weight="600">President checks the Courts: nominates judges</text>
    <text x="430" y="545" fill="#64748b" font-weight="600">Courts check the President: can rule actions unconstitutional</text>
  </g>
</svg>
