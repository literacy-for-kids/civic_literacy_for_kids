<svg viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crTitle">
  <title id="crTitle">Courtroom layout seen from above: judge&#8217;s bench at the front with the witness stand and clerk beside it, jury box on the right wall, prosecution and defense tables facing the bench, bailiff near the front, and the public gallery at the back</title>
  <rect x="1" y="1" width="858" height="538" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Inside a Courtroom</text>
  <text x="430" y="63" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">A bird&#8217;s-eye view &#8212; who sits where, and what they do.</text>

  <!-- room -->
  <rect x="70" y="82" width="720" height="430" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- judge bench -->
  <rect x="300" y="100" width="260" height="64" rx="8" fill="#4338ca"/>
  <text x="430" y="127" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">JUDGE</text>
  <text x="430" y="147" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#c7d2fe">runs the trial &#183; makes sure it is fair</text>

  <!-- witness stand -->
  <rect x="185" y="112" width="100" height="72" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="235" y="142" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#4338ca">WITNESS</text>
  <text x="235" y="158" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#475569">tells what</text>
  <text x="235" y="172" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#475569">they saw</text>

  <!-- clerk -->
  <rect x="575" y="112" width="100" height="72" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="625" y="142" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#4338ca">CLERK</text>
  <text x="625" y="158" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#475569">keeps the</text>
  <text x="625" y="172" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#475569">records</text>

  <!-- jury box -->
  <rect x="700" y="200" width="76" height="220" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="726" y="310" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#4338ca" transform="rotate(-90 726 310)">JURY BOX</text>
  <text x="754" y="310" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#475569" transform="rotate(-90 754 310)">listens + decides the facts</text>

  <!-- bailiff -->
  <rect x="90" y="200" width="76" height="110" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="128" y="245" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#4338ca" transform="rotate(-90 128 245)">BAILIFF</text>
  <text x="150" y="255" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#475569" transform="rotate(-90 150 255)">keeps order</text>

  <!-- counsel tables -->
  <rect x="215" y="250" width="190" height="80" rx="8" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
  <text x="310" y="282" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#4338ca">PROSECUTION / PLAINTIFF</text>
  <text x="310" y="302" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#475569">brings the case</text>

  <rect x="455" y="250" width="190" height="80" rx="8" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
  <text x="550" y="282" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#4338ca">DEFENSE</text>
  <text x="550" y="302" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#475569">answers the case</text>

  <!-- the bar -->
  <line x1="90" y1="368" x2="680" y2="368" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="385" y="388" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#94a3b8">the &#8220;bar&#8221; &#8212; only people in the case go past this line</text>

  <!-- gallery -->
  <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5">
    <rect x="120" y="405" width="250" height="30" rx="6"/>
    <rect x="120" y="448" width="250" height="30" rx="6"/>
    <rect x="420" y="405" width="250" height="30" rx="6"/>
    <rect x="420" y="448" width="250" height="30" rx="6"/>
  </g>
  <text x="395" y="500" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#64748b">GALLERY &#8212; the public can watch</text>
</svg>
