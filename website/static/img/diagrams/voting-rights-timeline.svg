<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vrTitle">
  <title id="vrTitle">Timeline of the expanding right to vote in the United States, from 1789 to 1971</title>
  <rect x="1" y="1" width="858" height="398" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">The Right to Vote Kept Expanding</text>
  <text x="430" y="66" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">At first, very few people could vote. Each milestone widened the circle.</text>

  <!-- timeline -->
  <line x1="70" y1="210" x2="800" y2="210" stroke="#4338ca" stroke-width="4"/>
  <g fill="#4338ca">
    <circle cx="100" cy="210" r="10"/>
    <circle cx="240" cy="210" r="10"/>
    <circle cx="380" cy="210" r="10"/>
    <circle cx="520" cy="210" r="10"/>
    <circle cx="640" cy="210" r="10"/>
    <circle cx="760" cy="210" r="10"/>
  </g>

  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <!-- above -->
    <text x="100" y="150" font-size="16" font-weight="700" fill="#4338ca">1789</text>
    <text x="100" y="172" font-size="12" fill="#475569">mostly white men</text>
    <text x="100" y="188" font-size="12" fill="#475569">who owned land</text>

    <text x="380" y="150" font-size="16" font-weight="700" fill="#4338ca">1920</text>
    <text x="380" y="172" font-size="12" fill="#475569">19th Amendment:</text>
    <text x="380" y="188" font-size="12" fill="#475569">women win the vote</text>

    <text x="640" y="150" font-size="16" font-weight="700" fill="#4338ca">1965</text>
    <text x="640" y="172" font-size="12" fill="#475569">Voting Rights Act protects</text>
    <text x="640" y="188" font-size="12" fill="#475569">voters from unfair barriers</text>

    <!-- below -->
    <text x="240" y="245" font-size="16" font-weight="700" fill="#4338ca">1870</text>
    <text x="240" y="267" font-size="12" fill="#475569">15th Amendment: voting</text>
    <text x="240" y="283" font-size="12" fill="#475569">cannot be denied by race</text>

    <text x="520" y="245" font-size="16" font-weight="700" fill="#4338ca">1924</text>
    <text x="520" y="267" font-size="12" fill="#475569">Native Americans</text>
    <text x="520" y="283" font-size="12" fill="#475569">recognized as citizens</text>

    <text x="760" y="245" font-size="16" font-weight="700" fill="#4338ca">1971</text>
    <text x="760" y="267" font-size="12" fill="#475569">26th Amendment:</text>
    <text x="760" y="283" font-size="12" fill="#475569">voting age lowered to 18</text>
  </g>

  <text x="430" y="345" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Even after a rule changed on paper, many people still faced unfair barriers in real life.</text>
  <text x="430" y="367" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">The work of making voting fair took generations &#8212; and people are still working on it today.</text>
</svg>
