<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ccTitle">
  <title id="ccTitle">Concentric circles of community: you at the center, then family, school, town or city, state, and country</title>
  <rect x="1" y="1" width="858" height="558" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Your Layers of Community</text>

  <g transform="translate(430 310)">
    <circle r="235" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <circle r="192" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <circle r="149" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
    <circle r="106" fill="#a5b4fc" stroke="#4338ca" stroke-width="2"/>
    <circle r="66" fill="#818cf8" stroke="#4338ca" stroke-width="2"/>
    <circle r="30" fill="#4338ca"/>
    <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle" font-weight="700">
      <text y="6" font-size="14" fill="#ffffff">YOU</text>
      <text y="-42" font-size="14.5" fill="#312e81">Family</text>
      <text y="-82" font-size="14.5" fill="#312e81">School</text>
      <text y="-124" font-size="14.5" fill="#3730a3">Town / City</text>
      <text y="-166" font-size="14.5" fill="#4338ca">State</text>
      <text y="-210" font-size="14.5" fill="#4338ca">Country</text>
    </g>
  </g>

  <text x="430" y="588" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b"></text>
</svg>
