<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cirTitle">
  <title id="cirTitle">The civic inquiry routine in four steps: claim, evidence, source, check</title>
  <defs>
    <marker id="cirA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="698" height="238" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="350" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">The Civic Inquiry Routine</text>

  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <g>
      <circle cx="100" cy="120" r="38" fill="#312e81"/>
      <text x="100" y="127" font-size="13.5" font-weight="800" fill="#ffffff">CLAIM</text>
      <text x="100" y="185" font-size="12.5" fill="#64748b">what is someone</text>
      <text x="100" y="202" font-size="12.5" fill="#64748b">saying is true?</text>
    </g>
    <g>
      <circle cx="267" cy="120" r="38" fill="#4338ca"/>
      <text x="267" y="127" font-size="11.5" font-weight="800" fill="#ffffff">EVIDENCE</text>
      <text x="267" y="185" font-size="12.5" fill="#64748b">what facts</text>
      <text x="267" y="202" font-size="12.5" fill="#64748b">back it up?</text>
    </g>
    <g>
      <circle cx="434" cy="120" r="38" fill="#6366f1"/>
      <text x="434" y="127" font-size="12.5" font-weight="800" fill="#ffffff">SOURCE</text>
      <text x="434" y="185" font-size="12.5" fill="#64748b">where does the</text>
      <text x="434" y="202" font-size="12.5" fill="#64748b">information come from?</text>
    </g>
    <g>
      <circle cx="601" cy="120" r="38" fill="#16a34a"/>
      <text x="601" y="127" font-size="13" font-weight="800" fill="#ffffff">CHECK</text>
      <text x="601" y="185" font-size="12.5" fill="#64748b">where else</text>
      <text x="601" y="202" font-size="12.5" fill="#64748b">could I look?</text>
    </g>
  </g>

  <g stroke="#4338ca" stroke-width="2.5">
    <line x1="141" y1="120" x2="223" y2="120" marker-end="url(#cirA)"/>
    <line x1="308" y1="120" x2="390" y2="120" marker-end="url(#cirA)"/>
    <line x1="475" y1="120" x2="557" y2="120" marker-end="url(#cirA)"/>
  </g>
</svg>
