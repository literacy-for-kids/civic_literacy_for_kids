<svg viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="csTitle">
  <title id="csTitle">Two parallel court systems: state courts (trial, appeals, state supreme court) and federal courts (district, circuit appeals), with the U.S. Supreme Court at the top of both</title>
  <defs>
    <marker id="csA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="498" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Two Court Systems, One Top Court</text>
  <text x="430" y="64" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Cases can climb the ladder by appeal &#8212; asking a higher court to take a second look.</text>

  <!-- US Supreme Court -->
  <rect x="290" y="88" width="280" height="58" rx="12" fill="#4338ca"/>
  <text x="430" y="113" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">U.S. SUPREME COURT</text>
  <text x="430" y="133" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#c7d2fe">the final word &#183; hears only a few cases</text>

  <!-- state ladder -->
  <text x="235" y="190" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#475569">STATE COURTS</text>
  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <rect x="110" y="205" width="250" height="56" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="235" y="228" font-size="13.5" font-weight="700" fill="#4338ca">State Supreme Court</text>
    <text x="235" y="247" font-size="12" fill="#475569">top court of the state</text>
    <rect x="110" y="295" width="250" height="56" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="235" y="318" font-size="13.5" font-weight="700" fill="#4338ca">State Appeals Court</text>
    <text x="235" y="337" font-size="12" fill="#475569">checks for mistakes</text>
    <rect x="110" y="385" width="250" height="56" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="235" y="408" font-size="13.5" font-weight="700" fill="#4338ca">State Trial Courts</text>
    <text x="235" y="427" font-size="12" fill="#475569">where most cases start</text>
  </g>
  <g stroke="#4338ca" stroke-width="2.5">
    <line x1="235" y1="385" x2="235" y2="355" marker-end="url(#csA)"/>
    <line x1="235" y1="295" x2="235" y2="265" marker-end="url(#csA)"/>
    <line x1="290" y1="205" x2="380" y2="150" marker-end="url(#csA)"/>
  </g>

  <!-- federal ladder -->
  <text x="625" y="190" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#475569">FEDERAL COURTS</text>
  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <rect x="500" y="250" width="250" height="56" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="625" y="273" font-size="13.5" font-weight="700" fill="#4338ca">Federal Appeals Courts</text>
    <text x="625" y="292" font-size="12" fill="#475569">check for mistakes</text>
    <rect x="500" y="385" width="250" height="56" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="625" y="408" font-size="13.5" font-weight="700" fill="#4338ca">Federal District Courts</text>
    <text x="625" y="427" font-size="12" fill="#475569">federal cases start here</text>
  </g>
  <g stroke="#4338ca" stroke-width="2.5">
    <line x1="625" y1="385" x2="625" y2="310" marker-end="url(#csA)"/>
    <line x1="570" y1="250" x2="480" y2="150" marker-end="url(#csA)"/>
  </g>

  <text x="430" y="478" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b">State courts handle most everyday cases. Federal courts handle federal laws, disputes between states, and constitutional questions.</text>
</svg>
