<svg viewBox="0 0 860 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bfTitle">
  <title id="bfTitle">The broken fence analogy: a maintained fence keeps rabbits out of the garden, while a neglected fence with fallen boards lets them eat the vegetables</title>
  <rect x="1" y="1" width="858" height="328" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">The Broken Fence</text>

  <!-- Left panel: maintained fence -->
  <g>
    <rect x="30" y="62" width="385" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="222" y="90" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#4338ca">Fence maintained</text>
    <!-- garden ground -->
    <rect x="55" y="215" width="240" height="38" rx="6" fill="#dcfce7"/>
    <!-- vegetables -->
    <g>
      <circle cx="85" cy="222" r="11" fill="#16a34a"/>
      <circle cx="125" cy="224" r="11" fill="#22c55e"/>
      <circle cx="165" cy="222" r="11" fill="#16a34a"/>
      <path d="M203 214 l7 22 l7 -22 z" fill="#f97316"/>
      <path d="M237 214 l7 22 l7 -22 z" fill="#f97316"/>
      <path d="M271 214 l7 22 l7 -22 z" fill="#f97316"/>
    </g>
    <!-- intact fence -->
    <g fill="#b45309">
      <rect x="308" y="140" width="12" height="115" rx="2"/>
      <rect x="326" y="140" width="12" height="115" rx="2"/>
      <rect x="344" y="140" width="12" height="115" rx="2"/>
      <rect x="304" y="158" width="58" height="8" rx="2" fill="#92400e"/>
      <rect x="304" y="210" width="58" height="8" rx="2" fill="#92400e"/>
    </g>
    <!-- rabbit outside -->
    <g fill="#94a3b8">
      <ellipse cx="388" cy="242" rx="15" ry="11"/>
      <circle cx="376" cy="232" r="8"/>
      <ellipse cx="372" cy="221" rx="2.8" ry="8"/>
      <ellipse cx="379" cy="220" rx="2.8" ry="8"/>
    </g>
    <text x="222" y="296" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#64748b">The fence doesn't grow the vegetables —</text>
    <text x="222" y="313" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#64748b">it protects them.</text>
  </g>

  <!-- Right panel: neglected fence -->
  <g>
    <rect x="445" y="62" width="385" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="637" y="90" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">Fence neglected</text>
    <!-- garden ground -->
    <rect x="470" y="215" width="240" height="38" rx="6" fill="#fef9c3"/>
    <!-- nibbled vegetables: stumps -->
    <g>
      <path d="M492 228 q8 -10 16 0 z" fill="#86efac"/>
      <path d="M540 228 q8 -8 16 0 z" fill="#86efac"/>
      <circle cx="590" cy="224" r="11" fill="#22c55e"/>
      <path d="M622 222 l6 14 l6 -14 z" fill="#fdba74"/>
    </g>
    <!-- broken fence: one leaning, one fallen, gap -->
    <g fill="#b45309">
      <rect x="723" y="140" width="12" height="115" rx="2"/>
      <g transform="rotate(28 765 255)">
        <rect x="759" y="140" width="12" height="115" rx="2"/>
      </g>
      <rect x="742" y="248" width="60" height="11" rx="2" transform="rotate(9 772 253)"/>
      <rect x="719" y="158" width="30" height="8" rx="2" fill="#92400e"/>
    </g>
    <!-- rabbits inside eating -->
    <g fill="#94a3b8">
      <ellipse cx="520" cy="242" rx="15" ry="11"/>
      <circle cx="532" cy="233" r="8"/>
      <ellipse cx="529" cy="222" rx="2.8" ry="8"/>
      <ellipse cx="536" cy="221" rx="2.8" ry="8"/>
    </g>
    <g fill="#a8a29e">
      <ellipse cx="660" cy="244" rx="15" ry="11"/>
      <circle cx="648" cy="235" r="8"/>
      <ellipse cx="644" cy="224" rx="2.8" ry="8"/>
      <ellipse cx="651" cy="223" rx="2.8" ry="8"/>
    </g>
    <text x="637" y="296" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#64748b">If nobody maintains the checks,</text>
    <text x="637" y="313" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#64748b">the garden gets eaten.</text>
  </g>
</svg>
