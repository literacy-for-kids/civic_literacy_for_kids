name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run validate:build

  lint-links:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./website/package-lock.json
      - run: npm ci
        working-directory: ./website
      - run: npm run build
        working-directory: ./website
      - run: npm run validate:build
        working-directory: ./website
      - name: Mirror build under site base path for lychee
        run: |
          rm -rf ./.lychee-root
          mkdir -p ./.lychee-root/civic_literacy_for_kids
          cp -R ./website/build/. ./.lychee-root/civic_literacy_for_kids/
          rm -f ./.lychee-root/civic_literacy_for_kids/404.html
          find ./.lychee-root/civic_literacy_for_kids -type f -name '*.html'             ! -name 'index.html' ! -name '404.html' | while read -r file; do
            route_dir="$(echo "$file" | sed '"'"'s/\.html$//'"'"')"
            mkdir -p "$route_dir"
            mv "$file" "$route_dir/index.html"
          done
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir ./.lychee-root
            --timeout 30
            --max-retries 3
            --retry-wait-time 5
            --exclude 'https://shields.io'
            --exclude 'https://camo.githubusercontent.com'
            --exclude 'https://literacy-for-kids.github.io'
            --exclude 'https://www.congress.gov'
            --exclude 'https://bensguide.gpo.gov'
            --exclude 'https://www.c-span.org'
            --exclude 'https://www.icivics.org'
            --exclude 'https://constitutioncenter.org'
            --exclude 'https://worldslargestlesson.globalgoals.org'
            --exclude 'https://www.pbslearningmedia.org'
            --exclude 'https://www.un.org'
            --exclude 'https://www.usa.gov'
            './.lychee-root/civic_literacy_for_kids/**/*.html'
          fail: true
